[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "thinprint"
version = "0.1.0"
description = "Turn SVG artwork into a thin, embossed STL"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
  "manifold3d>=3.0",
  "mapbox-earcut>=1.0",
  "shapely>=2.0",
  "svg.path>=6.3",
  "trimesh>=4.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
thinprint = "thinprint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thinprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
